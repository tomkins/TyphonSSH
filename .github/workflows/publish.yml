name: Publish

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build:
    name: Build, sign and notarize
    runs-on: xcode-27
    environment: publish
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check the tag matches typhonVersion
        run: |
          version=$(sed -n 's/^public let typhonVersion = "\(.*\)"$/\1/p' Sources/TyphonCore/Support/Version.swift)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match typhonVersion $version"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin_path=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          mkdir -p "$RUNNER_TEMP/stage"
          cp "$bin_path/tyssh" "$RUNNER_TEMP/stage/tyssh"
          test "$(lipo -archs "$RUNNER_TEMP/stage/tyssh")" = "x86_64 arm64"
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      - name: Sign
        run: |
          codesign --sign "Developer ID Application" \
            --options runtime \
            --entitlements Distribution/tyssh.entitlements \
            --timestamp \
            "$RUNNER_TEMP/stage/tyssh"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/stage/tyssh"
      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY" > "$key"
          # A bare binary can't be stapled, so Gatekeeper looks the ticket up online on first run.
          ditto -c -k "$RUNNER_TEMP/stage/tyssh" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$key"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization finished with status $status"
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          archive="tyssh-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -czf "dist/$archive" -C "$RUNNER_TEMP/stage" tyssh
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat dist/*.sha256
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tyssh-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish on GitHub Releases
    needs:
      - build
    runs-on: ubuntu-24.04
    environment:
      name: github-releases
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tyssh-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --title "TyphonSSH $GITHUB_REF_NAME"
          dist/*
